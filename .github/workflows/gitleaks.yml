name: gitleaks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned release, checksum verified)
        run: |
          set -euo pipefail
          V=8.30.1
          curl -sSfL -o gl.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gl.tgz" | sha256sum -c -
          tar -xzf gl.tgz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: Scan full history (findings are never printed)
        run: |
          set +e
          gitleaks git --no-banner --redact --log-opts="--all" --report-format json --report-path "$RUNNER_TEMP/gl.json" >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then echo "gitleaks: no leaks found"; exit 0; fi
          if [ "$rc" -eq 1 ]; then
            n=$(python3 -c "import json,sys;d=json.load(open('$RUNNER_TEMP/gl.json'));print(len(d), len({x['File'] for x in d}))")
            echo "gitleaks: LEAKS FOUND (findings, files) = $n. Details withheld; run gitleaks locally."
            exit 1
          fi
          echo "gitleaks: scanner error rc=$rc"; exit $rc
